name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  # Runs the action on this repository, so each image change is pulled and
  # run the way users run it before it is tagged.
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the action
        uses: ./
        with:
          dir: .
          output: json
          output-file: report.json

      - name: Check the report
        run: jq -e '.score.total > 0' report.json
