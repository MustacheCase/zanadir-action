name: Zanadir Action
description: "Grade your CI pipeline: find missing SAST, SCA, secrets and SBOM checks, and controls wired so they cannot fail a build"
branding:
  icon: shield
  color: purple

inputs:
  dir:
    description: 'Path to the repository directory (required)'
    required: true
  excluded-categories:
    description: 'List of excluded categories (optional)'
    required: false
  enforce:
    description: 'Fails the CI process when any category is uncovered (optional)'
    required: false
  fail-on:
    description: 'Fail only when these specific categories are uncovered (optional)'
    required: false
  fail-on-weakened:
    description: 'Also fail when a category has tooling that cannot fail a build (optional)'
    required: false
  baseline:
    description: 'Path to a baseline file of already-accepted gaps (optional)'
    required: false
  write-baseline:
    description: 'Write the current uncovered categories to the baseline file and exit successfully (optional)'
    required: false
  debug:
    description: 'Run the tool using debug mode (optional)'
    required: false
  output:
    description: 'Output format of the tool (table, json, sarif, markdown) (optional)'
    required: false
  output-file:
    description: 'Write the report to this file instead of stdout (optional)'
    required: false
  badge:
    description: 'Write a shields.io endpoint badge of the coverage score to this path (optional)'
    required: false
  config:
    description: 'Read settings and custom rules from this YAML file; inputs given here win (optional)'
    required: false
  required-checks:
    description: "Read the default branch's required checks: a control enforces only if its check must pass to merge (optional)"
    required: false
  token:
    description: 'Token for reading the merge settings with required-checks; read-only use (optional)'
    required: false
    default: ${{ github.token }}

runs:
  using: "docker"
  image: "docker://mustachecase/zanadir:0.24.0"
  env:
    GITHUB_TOKEN: ${{ inputs.token }}
  args:
    - "scan"
    - "--dir"
    - "${{ inputs.dir }}"
    - ${{ inputs.excluded-categories && '--excluded-categories' }}
    - ${{ inputs.excluded-categories }}
    - ${{ inputs.output && '--output' }}
    - ${{ inputs.output }}
    - ${{ inputs.output-file && '--output-file' }}
    - ${{ inputs.output-file }}
    - ${{ inputs.badge && '--badge' }}
    - ${{ inputs.badge }}
    - ${{ inputs.config && '--config' }}
    - ${{ inputs.config }}
    - ${{ inputs.fail-on && '--fail-on' }}
    - ${{ inputs.fail-on }}
    - ${{ inputs.baseline && '--baseline' }}
    - ${{ inputs.baseline }}
    - ${{ inputs.debug == 'true' && '--debug' || '' }}
    - ${{ inputs.enforce == 'true' && '--enforce' || '' }}
    - ${{ inputs.write-baseline == 'true' && '--write-baseline' || '' }}
    - ${{ inputs.fail-on-weakened == 'true' && '--fail-on-weakened' || '' }}
    - ${{ inputs.required-checks == 'true' && '--required-checks' || '' }}
