name: Zanadir Action
description: Scan your GitHub repository using Zanadir tool

inputs:
  dir:
    description: 'Path to the GitHub repository directory (required)'
    required: true
  excluded-categories:
    description: 'List of excluded categories (optional)'
    required: false
  enforce:
    description: 'Fails the CI process when any category is uncovered (optional)'
    required: false
  fail-on:
    description: 'Fail only when these specific categories are uncovered (optional)'
    required: false
  baseline:
    description: 'Path to a baseline file of already-accepted gaps (optional)'
    required: false
  write-baseline:
    description: 'Write the current uncovered categories to the baseline file and exit successfully (optional)'
    required: false
  debug:
    description: 'Run the tool using debug mode (optional)'
    required: false
  output:
    description: 'Output format of the tool (table, json, sarif) (optional)'
    required: false
  output-file:
    description: 'Write the report to this file instead of stdout (optional)'
    required: false

runs:
  using: "docker"
  image: "docker://mustachecase/zanadir:0.3.0"
  args:
    - "scan"
    - "--dir"
    - "${{ inputs.dir }}"
    - ${{ inputs.excluded-categories && '--excluded-categories' }}
    - ${{ inputs.excluded-categories }}
    - ${{ inputs.output && '--output' }}
    - ${{ inputs.output }}
    - ${{ inputs.output-file && '--output-file' }}
    - ${{ inputs.output-file }}
    - ${{ inputs.fail-on && '--fail-on' }}
    - ${{ inputs.fail-on }}
    - ${{ inputs.baseline && '--baseline' }}
    - ${{ inputs.baseline }}
    - ${{ inputs.debug == 'true' && '--debug' || '' }}
    - ${{ inputs.enforce == 'true' && '--enforce' || '' }}
    - ${{ inputs.write-baseline == 'true' && '--write-baseline' || '' }}
